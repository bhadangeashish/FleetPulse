<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="stormyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#384959"/>
      <stop offset="100%" stop-color="#2C3A47"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88BDF2"/>
      <stop offset="100%" stop-color="#6A89A7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#stormyGrad)"/>
  <!-- Truck Body -->
  <path d="M120 180 H280 V320 H120 Z" fill="#FFFFFF" opacity="0.95"/>
