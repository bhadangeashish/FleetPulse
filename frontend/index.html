<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FleetPulse TMS - Maharashtra to Gujarat Transport System</title>
    <meta name="description" content="Offline-First Transport Management System for Maharashtra to Gujarat freight corridors: daily fruit deliveries, backhaul return loads, diesel/CNG mileage, and vehicle health." />
    <meta property="og:title" content="FleetPulse TMS - Maharashtra to Gujarat Transport System" />
    <meta property="og:description" content="Enterprise offline-first transport operations console with activity-based ODO and real-time fleet health." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#384959" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FleetPulse TMS" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/icon-192.svg" />

    <!-- Google Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[FleetPulse PWA] ServiceWorker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('[FleetPulse PWA] ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
